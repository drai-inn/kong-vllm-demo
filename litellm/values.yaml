image:
  repository: ghcr.io/berriai/litellm-database
  pullPolicy: Always
#  tag: "main-v1.82.6.rc.2"

# A list of Kubernetes Secret objects that will be exported to the LiteLLM proxy
#  pod as environment variables.  These secrets can then be referenced in the
#  configuration file (or "litellm" ConfigMap) with `os.environ/<Env Var Name>`
environmentSecrets:
  - litellm-test-secret

ingress:
  enabled: true
  className: "kong"
  annotations:
    cert-manager.io/cluster-issuer: "zerossl-kong-issuer"
  hosts:
    - host: litellm.test.drai.auckland.ac.nz
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: litellm-test-tls
      hosts:
        - litellm.test.drai.auckland.ac.nz

service:
  annotations:
    konghq.com/connect-timeout: "600000"
    konghq.com/read-timeout: "600000"
    konghq.com/write-timeout: "600000"

extraContainers:
  - name: tailscale
    image: tailscale/tailscale:v1.94.2
    env:
      - name: TS_AUTHKEY
        valueFrom:
          secretKeyRef:
            name: tailscale-auth
            key: TS_AUTHKEY
      - name: TS_USERSPACE
        value: "false"
      - name: TS_KUBE_SECRET
        value: ""
      - name: TS_STATE_DIR
        value: "/tmp"
    securityContext:
      privileged: true

# The elements within proxy_config are rendered as config.yaml for the proxy
#  Examples: https://github.com/BerriAI/litellm/tree/main/litellm/proxy/example_config_yaml
#  Reference: https://docs.litellm.ai/docs/proxy/configs
proxy_config:
  general_settings:
    store_model_in_db: true
    store_prompts_in_spend_logs: true
  litellm_settings:
    drop_params: true
  model_list:
    # At least one model must exist for the proxy to start.
    - model_name: gpt-oss-20b
      litellm_params:
        model: hosted_vllm/gpt-oss-20b
        api_base: http://vllm-gptoss-service.kai-test.svc.cluster.local:8000/v1
        api_key: dummy
    - model_name: Qwen3-VL-Embedding-2B
      litellm_params:
        model: hosted_vllm/Qwen3-VL-Embedding-2B
        api_base: http://vllm-embedding-service.kai-test.svc.cluster.local:8000/v1
        api_key: dummy
        # Whitelist 'dimensions' for this specific model
        # This allows you to request 256, 512, or 1024 dims via the API
        # Prevent LiteLLM from dropping MRL or Vision params
        supported_openai_params: ["dimensions", "encoding_format", "user", "input_type"]
        # PEAK PERFORMANCE: Set max dimensions
        dimensions: 2048
        additional_drop_params: []
        encoding_format: ["float", "base64", "ubyte", "int8"]
      model_info:
        mode: embedding
        base_model: "qwen3-vl"
        # ENABLE MULTIMODAL/PDF: This flag tells LiteLLM to accept image/PDF inputs
        supports_embedding_image_input: true
        supports_pdf_input: true
        supports_video_input: true
        # Helps LiteLLM's internal tokenizer accurately count cost:
        max_input_tokens: 32768
        output_vector_size: 2048
    - model_name: Qwen3.6-35B-A3B
      litellm_params:
        model: hosted_vllm/Qwen3.6-35B-A3B
        api_base: http://100.92.18.86:8000/v1
        api_key: dummy
        supported_openai_params: ["dimensions", "encoding_format", "user", "input_type"]
        additional_drop_params: []
        encoding_format: ["float", "base64", "ubyte", "int8"]
      model_info:
        base_model: "qwen3"
    - model_name: gemma-4-26B-A4B-it
      litellm_params:
        model: hosted_vllm/gemma-4-26B-A4B-it
        api_base: http://100.65.5.85:8000/v1
        api_key: dummy
    - model_name: Qwen3-Embedding-4B
      litellm_params:
        model: hosted_vllm/Qwen3-Embedding-4B
        api_base: http://100.92.18.86:8001/v1
        api_key: dummy
        dimensions: 2560 # Peak for the 4B model
        supported_openai_params: ["dimensions", "encoding_format", "user", "input_type"]
        additional_drop_params: []
        encoding_format: ["float", "base64", "ubyte", "int8"]
      model_info:
        mode: embedding
        max_input_tokens: 32768  # Qwen3's actual limit
        output_vector_size: 1024 # The native full-dimension
    - model_name: F2LLM-v2-4B
      litellm_params:
        model: hosted_vllm/F2LLM-v2-4B
        api_base: http://100.65.5.85:8001/v1
        api_key: dummy
      model_info:
        mode: embedding
# Override PostgreSQL sub-chart image to use the node-cached image.
# Bitnami removed versioned tags from Docker Hub; pullPolicy: IfNotPresent
# prevents pulling and uses the already-cached image on the node.
postgresql:
  image:
    tag: "latest"
    pullPolicy: IfNotPresent

# Additional environment variables to be added to the deployment as a map of key-value pairs
envVars:
  CACHE_TYPE: "local" # "redis" or "local"
  STORE_MODEL_IN_DB: "True"
